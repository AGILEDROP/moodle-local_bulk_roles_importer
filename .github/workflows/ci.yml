name: Run all tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        moodle-branch:
          - 'MOODLE_403_STABLE'
          - 'MOODLE_404_STABLE'
          - 'MOODLE_405_STABLE'
          - 'MOODLE_500_STABLE'
          - 'MOODLE_501_STABLE'
          - 'MOODLE_502_STABLE'
          - 'MOODLE_503_STABLE'
        database: ['mariadb', 'pgsql']
        # Highest supported PHP and lowest supported database versions for each Moodle branch.
        include:
          - moodle-branch: 'MOODLE_403_STABLE'
            php: '8.2'
            postgres: '13'
            mariadb: '10.6'
          - moodle-branch: 'MOODLE_404_STABLE'
            php: '8.3'
            postgres: '13'
            mariadb: '10.6'
          - moodle-branch: 'MOODLE_405_STABLE'
            php: '8.3'
            postgres: '13'
            mariadb: '10.6'
          - moodle-branch: 'MOODLE_500_STABLE'
            php: '8.4'
            postgres: '14'
            mariadb: '10.11'
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.4'
            postgres: '15'
            mariadb: '10.11'
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.4'
            postgres: '16'
            mariadb: '10.11'
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.4'
            postgres: '17'
            mariadb: '11.4'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli
          tools: phpunit
          ini-values: max_input_vars=5000
      - name: Deploy moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
      - name: Install moodle-plugin-ci
        run: |
          set -x
          moodle-plugin-ci install -vvv --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Run phplint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: Run phpcpd
        if: ${{ always() }}
        run: moodle-plugin-ci phpcpd || true

      - name: Run phpmd
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Run codechecker
        if: ${{ always() }}
        run: moodle-plugin-ci codechecker

      - name: Run validate
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Run savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Run phpdoc
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: Run phpunit
        if: ${{ always() }}
        run: |
             moodle-plugin-ci phpunit
             cd moodle
             vendor/bin/phpunit --fail-on-risky --disallow-test-output --filter tool_dataprivacy_metadata_registry_testcase
             vendor/bin/phpunit --fail-on-risky --disallow-test-output --testsuite core_privacy_testsuite --filter provider_testcase
